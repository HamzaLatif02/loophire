<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <link rel="stylesheet" href="popup.css">
</head>
<body>
    <div id="app">
        <!-- Auth state: logged out -->
        <div id="logged-out" class="hidden">
            <div class="logo">
                <img src="../icons/icon48.png" width="32" />
                <span>Loophire</span>
            </div>
            <p class="subtitle">Log in to import jobs with one click</p>
            <input id="email"    type="email"    placeholder="Email"    />
            <input id="password" type="password" placeholder="Password" />
            <button id="login-btn">Log in</button>
            <p id="login-error" class="error hidden"></p>
            <a href="https://loophire.xyz/register" target="_blank"
               class="link">Create account</a>
        </div>

        <!-- Auth state: logged in -->
        <div id="logged-in" class="hidden">
            <div class="logo">
                <img src="../icons/icon48.png" width="32" />
                <span>Loophire</span>
            </div>
            <p id="user-email" class="email"></p>

            <!-- Shown when on a LinkedIn job page -->
            <div id="import-section" class="hidden">
                <div class="job-preview" id="job-preview"></div>
                <button id="import-btn" class="import-btn">
                    Import this job to Loophire
                </button>
                <p id="import-status" class="import-status hidden"></p>
                <div class="divider"></div>
            </div>

            <!-- Shown when NOT on a LinkedIn job page -->
            <div id="not-job-page" class="hidden">
                <p class="hint">
                    Navigate to a LinkedIn job listing to import it.
                </p>
                <div class="divider"></div>
            </div>

            <a href="https://loophire.xyz/applications"
               target="_blank" class="nav-link">
                📊 View dashboard
            </a>
            <a href="https://loophire.xyz/apply"
               target="_blank" class="nav-link">
                ✏️ New application
            </a>
            <div class="divider"></div>
            <button id="logout-btn" class="logout">Log out</button>
        </div>
    </div>
    <script src="popup.js"></script>
</body>
</html>
